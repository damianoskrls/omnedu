version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: omnedu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omnedu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnedu_dev}
      POSTGRES_DB: ${POSTGRES_DB:-omnedu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U omnedu']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: omnedu_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
