[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install -g pnpm@9.12.0", "pnpm install --frozen-lockfile"]

[phases.build]
cmds = [
  "pnpm --filter @omnedu/api exec prisma generate",
  "pnpm --filter @omnedu/api build",
  "NODE_OPTIONS=--max-old-space-size=3072 NEXT_PUBLIC_API_URL=https://omneduapi-production.up.railway.app/api/v1 pnpm --filter @omnedu/web build || echo 'web build failed, API will start without the site'"
]

[start]
cmd = "sh scripts/start-production.sh"
