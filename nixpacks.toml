[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install -g pnpm@9.12.0", "pnpm install --frozen-lockfile"]

[phases.build]
cmds = [
  "pnpm --filter @omnedu/api exec prisma generate",
  "pnpm --filter @omnedu/api build"
]

[start]
cmd = "cd apps/api && (node_modules/.bin/prisma migrate deploy || { node_modules/.bin/prisma migrate resolve --rolled-back 20261008160000_conversation_delete || true; node_modules/.bin/prisma migrate resolve --rolled-back 20261008170000_owner_role || true; node_modules/.bin/prisma migrate deploy || echo 'migration failed, starting api anyway'; }) && cd ../.. && node apps/api/dist/main"
