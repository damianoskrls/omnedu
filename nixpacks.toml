[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install -g pnpm@9.12.0", "pnpm install --frozen-lockfile"]

[phases.build]
cmds = [
  "pnpm --filter @omnedu/api exec prisma generate",
  "pnpm --filter @omnedu/api build"
]

[start]
cmd = "cd apps/api && node_modules/.bin/prisma migrate deploy && cd ../.. && node apps/api/dist/main"
